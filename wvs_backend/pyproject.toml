[project]
name = "wvs-backend"
version = "0.1.0"
description = "Backend services for the WVS web vulnerability scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "celery>=5.4.0",
  "certifi>=2024.8.30",
  "click>=8.1.7",
  "dnspython>=2.7.0",
  "email-validator>=2.3.0",
  "flask>=3.0.3",
  "flask-caching>=2.4.0",
  "flask-cors>=5.0.0",
  "flask-jwt-extended>=4.6.0",
  "flask-limiter>=3.9.2",
  "flask-migrate>=4.0.7",
  "flask-sqlalchemy>=3.1.1",
  "gunicorn>=23.0.0",
  "ipwhois>=1.3.0",
  "joblib>=1.4.2",
  "mysql-connector-python>=9.0.0",
  "numpy>=2.1.1",
  "pandas>=2.2.3",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.12.0",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
  "requests-cache>=1.3.1",
  "reportlab>=4.2.5",
  "requests>=2.32.3",
  "sqlalchemy>=2.0.35",
  "tenacity>=9.1.4",
  "tldextract>=5.1.2",
  "zaproxy>=0.5.0",
  "werkzeug>=3.0.4",
  "pycryptodome>=3.23.0",
  "httpx>=0.28.1",
  "builtwith>=1.3.4",
  "playwright>=1.60.0",
  "redis>=7.4.0",
  "clamd>=1.0.2",
  "yara-python>=4.5.4",
  "pefile>=2024.8.26",
  "oletools>=0.60.2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "pip-audit>=2.10.0",
  "pytest>=8.3.3",
  "ruff>=0.6.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
