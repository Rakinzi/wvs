x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  PORT: 5001
  DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://wvs:wvs_password@db:3306/wvs}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-me}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/2}
  REPORT_FOLDER: /app/reports
  UX_SCAN_SCREENSHOT_DIR: /app/reports/screenshots
  MALWARE_TEMP_DIR: /app/reports/malware
  REQUESTS_CACHE_NAME: /app/instance/http_cache
  LIGHTHOUSE_CLI_PATH: ${LIGHTHOUSE_CLI_PATH:-/usr/local/bin/lighthouse}
  LIGHTHOUSE_ENABLED: ${LIGHTHOUSE_ENABLED:-false}
  ZAP_ENABLED: ${ZAP_ENABLED:-true}
  ZAP_BASE_URL: ${ZAP_BASE_URL:-http://zap:8080}
  ZAP_API_KEY: ${ZAP_API_KEY:-}
  EXTERNAL_TOOLS_ENABLED: ${EXTERNAL_TOOLS_ENABLED:-true}
  NMAP_ENABLED: ${NMAP_ENABLED:-true}
  NIKTO_ENABLED: ${NIKTO_ENABLED:-true}
  WHATWEB_ENABLED: ${WHATWEB_ENABLED:-true}
  WAFW00F_ENABLED: ${WAFW00F_ENABLED:-true}
  SSLSCAN_ENABLED: ${SSLSCAN_ENABLED:-true}
  WPSCAN_ENABLED: ${WPSCAN_ENABLED:-true}
  SQLMAP_ENABLED: ${SQLMAP_ENABLED:-true}
  FFUF_ENABLED: ${FFUF_ENABLED:-true}
  FFUF_WORDLIST: ${FFUF_WORDLIST:-}
  CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
  SECURITY_SCAN_QUEUE: ${SECURITY_SCAN_QUEUE:-security_scans}
  UX_SCAN_QUEUE: ${UX_SCAN_QUEUE:-ux_scans}

x-backend-service: &backend-service
  image: wvs-backend:local
  env_file:
    - .env.docker
  environment:
    <<: *backend-env
  volumes:
    - backend_instance:/app/instance
    - backend_reports:/app/reports
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  frontend:
    build:
      context: ./wvs
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
    image: wvs-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    <<: *backend-service
    build:
      context: ./wvs_backend
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker-security:
    <<: *backend-service
    command: >
      uv run celery -A app.celery_app:celery_app worker
      -Q ${SECURITY_SCAN_QUEUE:-security_scans}
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${SECURITY_WORKER_CONCURRENCY:-2}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-ux:
    <<: *backend-service
    shm_size: "1gb"
    command: >
      uv run celery -A app.celery_app:celery_app worker
      -Q ${UX_SCAN_QUEUE:-ux_scans}
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${UX_WORKER_CONCURRENCY:-1}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  beat:
    <<: *backend-service
    command: >
      uv run celery -A app.celery_app:celery_app beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --schedule=/app/instance/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wvs}
      MYSQL_USER: ${MYSQL_USER:-wvs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wvs_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zap:
    image: zaproxy/zap-stable:latest
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    ports:
      - "${ZAP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/JSON/core/view/version/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  backend_instance:
  backend_reports:
  db_data:
  redis_data:
